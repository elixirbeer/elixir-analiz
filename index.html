<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elixir Simya Analizi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="quiz-container">
        <h1 class="brand-name">ELIXIR</h1>
        <p class="subtitle">Simya Analizi</p>

            <div id="question-area">
                <p id="question-text"></p>

        </div>

        <div id="result-area" class="hidden">
            <h2 id="result-title">Sizin İksiriniz Belirlendi!</h2>
            <div id="recommendation-box">
                <p id="product-name"></p>
                <p id="product-desc"></p>
            </div>
            <div class="discount-section">
                <p>Analiz Tamamlandı. %20 İndirim Kodunuz:</p>
                <div id="promo-code">ELIXIR20</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
